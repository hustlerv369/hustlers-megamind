<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13">
  <defs>
    <linearGradient id="bgFlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#010409"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="900" height="420" fill="url(#bgFlow)" rx="12"/>
  <rect x="0" y="0" width="900" height="420" fill="none" stroke="#30363d" rx="12"/>

  <text x="450" y="40" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="bold">
    Four hooks · Claude Code lifecycle
  </text>

  <g transform="translate(50, 90)">
    <rect width="180" height="90" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="90" y="28" text-anchor="middle" fill="#3fb950" font-weight="bold">SessionStart</text>
    <text x="90" y="50" text-anchor="middle" fill="#e6edf3" font-size="11">MEMORY.md index</text>
    <text x="90" y="66" text-anchor="middle" fill="#e6edf3" font-size="11">+ newest session</text>
    <text x="90" y="82" text-anchor="middle" fill="#7d8590" font-size="10">≤1500 tokens · once</text>
  </g>

  <g transform="translate(260, 90)">
    <rect width="180" height="90" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="90" y="28" text-anchor="middle" fill="#58a6ff" font-weight="bold">UserPromptSubmit</text>
    <text x="90" y="50" text-anchor="middle" fill="#e6edf3" font-size="11">keyword grep</text>
    <text x="90" y="66" text-anchor="middle" fill="#e6edf3" font-size="11">top-3 snippets</text>
    <text x="90" y="82" text-anchor="middle" fill="#7d8590" font-size="10">≤400 · silent no-op</text>
  </g>

  <g transform="translate(470, 90)">
    <rect width="180" height="90" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="90" y="28" text-anchor="middle" fill="#d29922" font-weight="bold">PreCompact</text>
    <text x="90" y="50" text-anchor="middle" fill="#e6edf3" font-size="11">write transcript</text>
    <text x="90" y="66" text-anchor="middle" fill="#e6edf3" font-size="11">tail to sessions/</text>
    <text x="90" y="82" text-anchor="middle" fill="#7d8590" font-size="10">0 tokens · writes only</text>
  </g>

  <g transform="translate(680, 90)">
    <rect width="170" height="90" rx="10" fill="#161b22" stroke="#7d8590" stroke-width="2"/>
    <text x="85" y="28" text-anchor="middle" fill="#c9d1d9" font-weight="bold">Stop</text>
    <text x="85" y="50" text-anchor="middle" fill="#e6edf3" font-size="11">touch .last-active</text>
    <text x="85" y="66" text-anchor="middle" fill="#e6edf3" font-size="11">marker</text>
    <text x="85" y="82" text-anchor="middle" fill="#7d8590" font-size="10">0 tokens · writes only</text>
  </g>

  <path d="M 50 230 L 850 230" stroke="#30363d" stroke-width="1"/>

  <g transform="translate(70, 250)">
    <text x="0" y="0" fill="#e6edf3" font-size="14" font-weight="bold">Memory layout per project</text>
    <text x="0" y="22" fill="#7d8590" font-size="11">~/.claude/projects/&lt;slug&gt;/memory/</text>

    <g font-size="12" fill="#e6edf3">
      <text x="0" y="50">├── <tspan fill="#58a6ff">MEMORY.md</tspan>           <tspan fill="#7d8590"># index — one line per entry</tspan></text>
      <text x="0" y="70">├── <tspan fill="#58a6ff">facts/</tspan>                <tspan fill="#7d8590"># pricing, stack, conventions</tspan></text>
      <text x="0" y="90">├── <tspan fill="#58a6ff">sessions/</tspan>             <tspan fill="#7d8590"># diary + pre-compact snapshots</tspan></text>
      <text x="0" y="110">└── <tspan fill="#58a6ff">.last-active</tspan>         <tspan fill="#7d8590"># Stop-hook marker</tspan></text>
    </g>
  </g>

  <g transform="translate(530, 260)">
    <rect width="320" height="100" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="16" y="26" fill="#3fb950" font-weight="bold" font-size="12">Design contract</text>
    <text x="16" y="48" fill="#e6edf3" font-size="11">✓ Hard token budgets (format_budget clips)</text>
    <text x="16" y="66" fill="#e6edf3" font-size="11">✓ Silent no-op when no relevant match</text>
    <text x="16" y="84" fill="#e6edf3" font-size="11">✓ Live conversation overrides stale memory</text>
  </g>
</svg>
