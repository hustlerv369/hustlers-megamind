name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.9', '3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest (only test dep)
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Hook scripts are importable
        run: |
          python -c "import sys; sys.path.insert(0, 'scripts'); import lib; print('OK')"
          python -c "import sys; sys.path.insert(0, 'scripts'); import hook_session_start"
          python -c "import sys; sys.path.insert(0, 'scripts'); import hook_user_prompt"
          python -c "import sys; sys.path.insert(0, 'scripts'); import hook_pre_compact"
          python -c "import sys; sys.path.insert(0, 'scripts'); import hook_stop"

      - name: install.py dry-run (help only)
        run: python scripts/install.py --help || true
